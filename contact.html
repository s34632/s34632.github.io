        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Mitr:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="css/style.css">

</head>


<body>


<header class="navbar">

    <a href="index.html"
        class="logo">

        Mini<span>Portfolio</span> ♡

    </a>


    <button class="menu-toggle">
        ☰
    </button>


    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="about.html">
            About
        </a>

        <a href="portfolio.html">
            Portfolio
        </a>

        <a href="contact.html"
            class="active">

            Contact

        </a>

    </nav>

</header>



<main>


<section class="page-hero">

    <p class="eyebrow">
        LET'S TALK ♡
    </p>

    <h1>
        Contact Me
    </h1>

    <p>
        อยากพูดคุยหรือสอบถามอะไร
        ทักมาได้เลยค่ะ!
    </p>

</section>



<section class="contact-layout section">


    <!-- CONTACT INFO -->

    <div class="contact-card">

        <div class="contact-icon">
            💌
        </div>

        <h2>
            Say Hello!
        </h2>

        <p>
            สามารถติดต่อฉันผ่านช่องทางด้านล่าง
        </p>


        <a href="mailto:s34632@banbung.ac.th">
            Gmail
        </a>


        <a href="https://github.com/s34632"
            target="_blank">

            GitHub

        </a>


        <a href="https://www.instagram.com/n1chxc_ke"
            target="_blank">

            Instagram

        </a>

    </div>



    <!-- FORM -->

    <form
        class="contact-form"
        onsubmit="event.preventDefault(); alert('ขอบคุณสำหรับข้อความ ♡');">


        <label>

            ชื่อ

            <input
                type="text"
                placeholder="Your name"
                required>

        </label>



        <label>

            Email

            <input
                type="email"
                placeholder="you@example.com"
                required>

        </label>



        <label>

            ข้อความ

            <textarea
                rows="6"
                placeholder="เขียนข้อความตรงนี้..."
                required></textarea>

        </label>


        <button
            class="btn primary"
            type="submit">

            ส่งข้อความ ♡

        </button>


    </form>


</section>

</main>



<footer>

    <p>
       Made with ♡ by ณิชาภัทร
    </p>
